<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>خريطة الشهداء</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>

  <style>
    body {
      margin: 0;
      display: flex;
      background-color: #1e1e1e;
      color: white;
      font-family: 'Cairo', sans-serif;
      height: 100vh;
      overflow: hidden;
    }
#map {
  position: relative;
  width: 70%;
  height: 100vh;
}

.leaflet-tile {
  filter: invert(100%) hue-rotate(180deg) brightness(85%) contrast(90%) grayscale(30%);
}
    
    #chartContainer {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(44, 44, 44, 0.85);
      padding: 10px;
      border-radius: 8px;
      width: 280px;
      color: white;
      z-index: 1000;
      user-select: none;
    }
    #victimChart {
      background: transparent !important;
      width: 280px !important;
      height: 280px !important;
    }
    #controls {
      width: 30%;
      padding: 15px;
      background: #2c2c2c;
      overflow-y: auto;
      box-sizing: border-box;
    }
    label, select, input, button {
      display: block;
      margin-bottom: 10px;
      width: 100%;
      background-color: #444;
      border: none;
      color: white;
      padding: 7px;
      box-sizing: border-box;
      font-size: 14px;
    }
    select[multiple] {
      height: 100px;
    }
    button#clearFilters {
      background-color: #8b0000;
      cursor: pointer;
      font-weight: bold;
      font-size: 16px;
      margin-top: 10px;
      transition: background-color 0.3s ease;
    }
    button#clearFilters:hover {
      background-color: #a50000;
    }
    p#count {
      font-weight: bold;
      margin-top: 15px;
      font-size: 16px;
    }
  </style>
</head>
<body>

<div id="map">
  <div id="chartContainer">
    <canvas id="victimChart"></canvas>
  </div>
</div>

<div id="controls">
  <label>محافظة الإصابة:</label>
  <select id="filterGov" multiple></select>

  <label>مكان الإصابة بالجسم:</label>
  <select id="filterInjuryPlace" multiple></select>

  <label>أداة القتل:</label>
  <select id="filterWeapon" multiple></select>

  <label>احتجاز الجثمان:</label>
  <select id="filterBodyHeld">
    <option value="">الكل</option>
    <option value="نعم">نعم</option>
    <option value="لا">لا</option>
  </select>

  <label>تاريخ الوفاة من:</label>
  <input type="date" id="dateFrom" />

  <label>إلى:</label>
  <input type="date" id="dateTo" />

  <label>بحث جزئي بالاسم:</label>
  <input type="text" id="searchName" />

  <button id="clearFilters">مسح الفلاتر</button>

  <p id="count">عدد النتائج: 0</p>
</div>

<script>
const map = L.map('map').setView([32, 35], 9.4);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
  maxZoom: 19
}).addTo(map);

const dataURL = "https://script.google.com/macros/s/AKfycbwhDfJlpNPUu4vPeJuDdAU5zjT5dTCYW61HiRr_jYCPwFQaoaecINruTsUgMdb-A92OtA/exec";

let jsonData = [];
let markers = [];

/* ⭐ تنسيق التاريخ إلى الصيغة المطلوبة: DD/MM/YYYY */
function formatDate(dateString) {
  const d = new Date(dateString);
  if (isNaN(d)) return dateString;
  const day = String(d.getDate()).padStart(2, '0');
  const month = String(d.getMonth() + 1).padStart(2, '0');
  const year = d.getFullYear();
  return `${day}/${month}/${year}`;
}

fetch(dataURL)
  .then(res => res.json())
  .then(data => {
    jsonData = data;
    populateFilters(data);
    updateMap();
  })
  .catch(err => console.error("خطأ في تحميل البيانات:", err));

function populateFilters(data) {
  const govSet = new Set();
  const injuryPlaceSet = new Set();
  const weaponSet = new Set();

  data.forEach(d => {
    if(d["محافظة الاصابة"]) govSet.add(d["محافظة الاصابة"]);
    if(d["مكان الاصابة بالجسم"]) injuryPlaceSet.add(d["مكان الاصابة بالجسم"]);
    if(d["أداة القتل"]) weaponSet.add(d["أداة القتل"]);
  });

  fillSelect('filterGov', govSet);
  fillSelect('filterInjuryPlace', injuryPlaceSet);
  fillSelect('filterWeapon', weaponSet);
}

function fillSelect(id, items) {
  const select = document.getElementById(id);
  select.innerHTML = "";
  items.forEach(item => {
    const option = document.createElement("option");
    option.value = item;
    option.textContent = item;
    select.appendChild(option);
  });
}

function startOfDay(date) {
  const d = new Date(date);
  d.setHours(0,0,0,0);
  return d;
}

function endOfDay(date) {
  const d = new Date(date);
  d.setHours(23,59,59,999);
  return d;
}

function updateMap() {
  markers.forEach(m => map.removeLayer(m));
  markers = [];

  const govFilter = Array.from(document.getElementById("filterGov").selectedOptions).map(o => o.value);
  const injuryFilter = Array.from(document.getElementById("filterInjuryPlace").selectedOptions).map(o => o.value);
  const weaponFilter = Array.from(document.getElementById("filterWeapon").selectedOptions).map(o => o.value);
  const heldFilter = document.getElementById("filterBodyHeld").value;
  const nameSearch = document.getElementById("searchName").value.trim().toLowerCase();
  const dateFrom = document.getElementById("dateFrom").value;
  const dateTo = document.getElementById("dateTo").value;

  const filtered = jsonData.filter(d => {
    let deathDate = new Date(d["تاريخ الوفاة"]);

    let fromDateObj = dateFrom ? startOfDay(dateFrom) : null;
    let toDateObj = dateTo ? endOfDay(dateTo) : null;

    if (fromDateObj && toDateObj && fromDateObj.getTime() === startOfDay(dateTo).getTime()) {
      toDateObj.setHours(23,59,59,999);
    }

    const dateValid = (!fromDateObj || deathDate >= fromDateObj) &&
                      (!toDateObj || deathDate <= toDateObj);

    return (
      (govFilter.length === 0 || govFilter.includes(d["محافظة الاصابة"])) &&
      (injuryFilter.length === 0 || injuryFilter.includes(d["مكان الاصابة بالجسم"])) &&
      (weaponFilter.length === 0 || weaponFilter.includes(d["أداة القتل"])) &&
      (!heldFilter || d["احتجاز"] === heldFilter) &&
      (!nameSearch || (d["Name"] && d["Name"].toLowerCase().includes(nameSearch))) &&
      dateValid &&
      d.latitude && d.longitude
    );
  });

  document.getElementById("count").textContent = "عدد الشهداء: " + filtered.length;

  const colors = ['#ad1e31', '#800020', '#c62828', '#a1887f', '#6d4c41'];

  filtered.forEach((d, idx) => {
    const lat = parseFloat(d.latitude);
    const lon = parseFloat(d.longitude);

    const sameLocation = filtered.filter(v =>
      parseFloat(v.latitude) === lat &&
      parseFloat(v.longitude) === lon
    );

    let popupContent = "";
    sameLocation.forEach(v => {
      popupContent += `
        <b>${v["Name"] || v["عنوان الملف"]}</b><br>
              العمر : ${v["العمر"]}<br>
       محافظة الإقامة : ${v["محافظة الإقامة"]}<br>
        أداة القتل: ${v["أداة القتل"]}<br>
  الجاني : ${v["الجاني"]}<br>
        احتجاز الجثمان: ${v["احتجاز"]}<br>
        <hr>
      `;
    });

    if (!isNaN(lat) && !isNaN(lon)) {
      const marker = L.circleMarker([lat, lon], {
        radius: 5,
        fillColor: colors[idx % colors.length],
        color: "#880e4f",
        weight: 1.5,
        fillOpacity: 0.9
      }).bindPopup(popupContent);

      marker.addTo(map);
      markers.push(marker);
    }
  });

  drawChart(filtered);
}

let pieChart;
function drawChart(data) {
  const ctx = document.getElementById("victimChart").getContext("2d");
  const counts = {};
  const colorMap = {
    "طفل": "#f5deb3",
    "طفلة": "#6d4c41",
    "امرأة": "#4caf50",
    "رجل": "#d32f2f",
    "غير معروف": "#9e9e9e"
  };

  data.forEach(d => {
    const type = d["صنف الضحية"]?.trim() || "غير معروف";
    counts[type] = (counts[type] || 0) + 1;
  });

  const labels = Object.keys(counts);
  const values = Object.values(counts);
  const backgroundColors = labels.map(label => colorMap[label] || "#9e9e9e");

  if (pieChart) pieChart.destroy();
  pieChart = new Chart(ctx, {
    type: 'pie',
    data: {
      labels: labels,
      datasets: [{
        data: values,
        backgroundColor: backgroundColors,
        hoverOffset: 8
      }]
    },
    options: {
      plugins: {
        legend: { display: true, position: 'bottom' },
        datalabels: {
          color: 'white',
          font: { weight: 'bold', size: 14 },
          formatter: (value, ctx) => `${value} - ${ctx.chart.data.labels[ctx.dataIndex]}`
        }
      },
      onHover: (e) => { e.native.target.style.cursor = 'pointer'; }
    },
    plugins: [ChartDataLabels]
  });
}

document.querySelectorAll("select, input").forEach(el => {
  el.addEventListener("change", updateMap);
  el.addEventListener("input", updateMap);
});

document.getElementById("clearFilters").addEventListener("click", () => {
  document.getElementById("filterGov").selectedIndex = -1;
  document.getElementById("filterInjuryPlace").selectedIndex = -1;
  document.getElementById("filterWeapon").selectedIndex = -1;
  document.getElementById("filterBodyHeld").value = "";
  document.getElementById("dateFrom").value = "";
  document.getElementById("dateTo").value = "";
  document.getElementById("searchName").value = "";
  updateMap();
});
</script>

</body>
</html>
